spring:
  datasource:
    url: jdbc:mysql://localhost:3306/ruwanthi?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: root
    password: hirushan
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  data:
    redis:
      host: localhost
      port: 6379
      timeout: 60000   # 60 seconds

  session:
    store-type: redis
    data:
      redis:
        namespace: petclinic:sessions
        flush-mode: on_save
        save-mode: on_set_attribute
