spring:
  datasource:
    url: jdbc:mysql://localhost:3306/petclinic?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: root
    password: ru123@jay
    driver-class-name: com.mysql.cj.jdbc.Driver

  servlet:
    multipart:
      enabled: true
      max-file-size: 5MB
      max-request-size: 10MB

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

  flyway:
    enabled: true
    baseline-on-migrate: true
    validate-on-migrate: false  # Disable validation to bypass checksum mismatch
    locations: classpath:db/migration

  data:
    redis:
      host: localhost
      port: 6379
      timeout: 60000   # 60 seconds

  session:
    # Use container-managed HTTP session in local dev; Redis is optional.
    store-type: none
    data:
      redis:
        namespace: petclinic:sessions
        flush-mode: on_save
        save-mode: on_set_attribute

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    protocol: smtp
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

app:
  mail:
    mock-enabled: false
    fail-on-error: false
  vaccination-reminders:
    enabled: true
    cron: "0 0 9 * * *"
  upload:
    dir: uploads/pet-images
